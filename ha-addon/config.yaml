name: "AI Automation Assistant"
version: "1.0.0"
slug: "ai_automation_assistant"
description: "Create and manage Home Assistant automations using natural language AI"
url: "https://github.com/vdefreit/homeassistant-mcp"
arch:
  - aarch64
  - amd64
  - armv7
  - i386
homeassistant_api: true
hassio_api: true
auth_api: true
init: false
startup: application
map:
  - config:rw
options:
  llm_provider: "openai"
  openai_api_key: ""
  openai_model: "gpt-4o-mini"
  openai_base_url: ""
  claude_api_key: ""
  claude_model: "claude-sonnet-4-20250514"
  ollama_url: "http://localhost:11434"
  ollama_model: "llama3"
schema:
  llm_provider: list(openai|claude|ollama)
  openai_api_key: str?
  openai_model: str?
  openai_base_url: url?
  claude_api_key: str?
  claude_model: str?
  ollama_url: url?
  ollama_model: str?
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-happy
panel_title: "AI Automations"
